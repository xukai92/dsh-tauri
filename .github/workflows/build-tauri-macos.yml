name: Build Tauri macOS

# Build and upload the macOS desktop shell (apps/tauri). The .app/.dmg
# bundling, ad-hoc code signing, and icon.icns handling are macOS-only steps,
# so this runs on an Apple Silicon (arm64) macOS runner; the Rust itself also
# compiles on Linux (see apps/tauri/README.md).
#
# Intel (x86_64) is intentionally not built: GitHub's macos-13 Intel runners are
# deprecated, and an x86_64 leg queues forever without a runner. Revisit via
# cross-compilation on the arm64 runner if Intel coverage is ever needed.
#
# Runs on push (except Dependabot branches), on PRs touching the shell, or manually.
on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    paths:
      - 'apps/tauri/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: macOS aarch64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the dsh web sidecar
        run: node --import tsx/esm scripts/build-tauri-sidecar.ts --targets node24-macos-arm64

      - name: Build the Tauri app
        working-directory: apps/tauri
        run: pnpm --config.verify-deps-before-run=false tauri build

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: dsh-tauri-macos-aarch64
          path: |
            apps/tauri/src-tauri/target/release/bundle/macos/*.app
            apps/tauri/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
