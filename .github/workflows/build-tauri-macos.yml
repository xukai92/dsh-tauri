name: Build Tauri macOS

# Build and upload the macOS desktop shell (apps/tauri). The .app/.dmg
# bundling, ad-hoc code signing, and icon.icns handling are macOS-only steps,
# so this runs on an Apple Silicon (arm64) macOS runner; the Rust itself also
# compiles on Linux (see apps/tauri/README.md).
#
# Intel (x86_64) is intentionally not built: GitHub's macos-13 Intel runners are
# deprecated, and an x86_64 leg queues forever without a runner. Revisit via
# cross-compilation on the arm64 runner if Intel coverage is ever needed.
#
# Runs on branch pushes (except Dependabot), on PRs touching the shell, on
# tauri-v* tags, or manually. A tag run also publishes the DMG to GitHub Releases.
on:
  push:
    branches-ignore:
      - 'dependabot/**'
    tags:
      - 'tauri-v*'
  pull_request:
    paths:
      - 'apps/tauri/**'
      - 'scripts/build-tauri-sidecar.ts'
      - 'scripts/build-exe-for-python-sdk.ts'
      - 'scripts/smoke-tauri-bundle.ts'
      - 'python/sdk-runtime/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: macOS aarch64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/tauri-v')
        run: |
          version=$(node -p "require('./apps/tauri/src-tauri/tauri.conf.json').version")
          cargo_version=$(node -e "const fs=require('node:fs'); const text=fs.readFileSync('apps/tauri/src-tauri/Cargo.toml','utf8'); const value=/^version = \"([^\"]+)\"$/m.exec(text)?.[1]; if (!value) process.exit(1); process.stdout.write(value)")
          expected="tauri-v$version"
          if [[ "$cargo_version" != "$version" ]]; then
            echo "::error::Cargo version $cargo_version does not match Tauri version $version."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "::error::Release tag must be $expected, got $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the sidecar supervisor
        run: |
          rustc --edition=2021 --test apps/tauri/src-tauri/tests/supervisor.rs -o "$RUNNER_TEMP/dsh-supervisor-test"
          "$RUNNER_TEMP/dsh-supervisor-test"

      - name: Build the dsh web sidecar
        run: pnpm exec tsx scripts/build-tauri-sidecar.ts --targets node24-macos-arm64

      - name: Build the Tauri app
        working-directory: apps/tauri
        run: pnpm --config.verify-deps-before-run=false tauri build

      - name: Verify macOS code signature
        run: |
          apps=(apps/tauri/src-tauri/target/release/bundle/macos/*.app)
          if [[ ${#apps[@]} -ne 1 || ! -d "${apps[0]}" ]]; then
            echo "::error::Expected exactly one macOS app bundle."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"

      - name: Smoke-test signed macOS bundle
        run: |
          apps=(apps/tauri/src-tauri/target/release/bundle/macos/*.app)
          if [[ ${#apps[@]} -ne 1 || ! -d "${apps[0]}" ]]; then
            echo "::error::Expected exactly one macOS app bundle."
            exit 1
          fi
          node --import tsx/esm scripts/smoke-tauri-bundle.ts --app "${apps[0]}"

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: dsh-tauri-macos-aarch64
          path: |
            apps/tauri/src-tauri/target/release/bundle/macos/*.app
            apps/tauri/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/tauri-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS bundle
        uses: actions/download-artifact@v4
        with:
          name: dsh-tauri-macos-aarch64
          path: dist

      - name: Publish macOS release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/dmg/*.dmg)
          if [[ ${#assets[@]} -ne 1 || ! -f "${assets[0]}" ]]; then
            echo "::error::Expected exactly one DMG in dist/dmg."
            exit 1
          fi

          flags=(--verify-tag --generate-notes)
          version="${GITHUB_REF_NAME#tauri-v}"
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" "${assets[0]}"
