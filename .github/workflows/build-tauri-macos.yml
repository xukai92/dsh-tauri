name: Build Tauri macOS

# Build and upload the macOS desktop shell (apps/tauri). The .app/.dmg
# bundling, ad-hoc code signing, and icon.icns handling are macOS-only steps,
# so this runs on macOS runners; the Rust itself also compiles on Linux
# (see apps/tauri/README.md). Run manually or on PRs touching the shell.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/tauri/**'

permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: aarch64
          - runner: macos-13
            arch: x86_64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Tauri app
        working-directory: apps/tauri
        run: pnpm tauri build

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: dsh-tauri-macos-${{ matrix.arch }}
          path: |
            apps/tauri/src-tauri/target/release/bundle/macos/*.app
            apps/tauri/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
